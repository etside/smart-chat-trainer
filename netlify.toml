[build]
  command = "npm run build"
  publish = ".netlify"

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[context.deploy-preview]
  command = "npm run build"

# Custom domain configuration
[[redirects]]
  from = "https://daddyai.online/*"
  to = "https://www.daddyai.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://daddyai.online/*"
  to = "https://www.daddyai.online/:splat"
  status = 301
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200

[functions]
  directory = ".netlify/functions-internal"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(), camera=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.v2.wearimpressive.com; frame-src 'none'; object-src 'none'"