name: Build & Deploy DaddyAI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_snapshot:
        description: "Skip pre-deploy DO snapshot"
        type: boolean
        default: false
      rollback:
        description: "Rollback to previous commit"
        type: boolean
        default: false

env:
  DROPLET_ID: "608481907"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ github.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Get meta
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build (client + SSR)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SITE_URL: 'https://daddyai.online'
          VITE_APP_NAME: 'Daddy AI'

      - name: Verify dist
        run: |
          echo "Client chunks:" && ls dist/client/assets/*.js 2>/dev/null | wc -l
          echo "Server entry:" && ls dist/server/server.js 2>/dev/null || echo "not found"
          ls dist/server/assets/validate-*.js 2>/dev/null && echo "validate route OK" || echo "WARNING: validate chunk missing"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  pre-deploy:
    name: Pre-deploy B2 Backup
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.skip_snapshot && !inputs.rollback }}
    steps:
      - name: Backup project to B2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Creating pre-deploy backup for commit ${{ needs.build.outputs.short_sha }}..."
            BACKUP_NAME="pre-deploy-${{ needs.build.outputs.short_sha }}-$(date +%Y%m%d%H%M%S).tar.gz"
            cd /var/www
            tar czf "/tmp/$BACKUP_NAME" \
              --exclude='node_modules' \
              --exclude='.git' \
              --exclude='dist' \
              daddyai/ 2>/dev/null || true
            if command -v b2 >/dev/null 2>&1; then
              b2 file upload Kpakkaka "/tmp/$BACKUP_NAME" "KK/backups/daddyai/$BACKUP_NAME" 2>&1 && \
                echo "Backup uploaded: KK/backups/daddyai/$BACKUP_NAME" || \
                echo "B2 upload failed (non-fatal, continuing deploy)"
            else
              echo "b2 not installed — skipping B2 upload (continuing deploy)"
            fi
            rm -f "/tmp/$BACKUP_NAME"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build, pre-deploy]
    if: always() && needs.build.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/daddyai
            cd /var/www/daddyai

            # Install PM2 if missing
            export PATH="$PATH:/usr/local/bin:/root/.local/bin"
            which pm2 >/dev/null 2>&1 || npm i -g pm2

            echo "--- Installing dependencies ---"
            npm ci --prefer-offline 2>/dev/null || npm install

      - name: Upload dist to VPS
        uses: appleboy/scp-action@v2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist"
          target: /var/www/daddyai

      - name: Reload DaddyAI via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export PATH="$PATH:/usr/local/bin:/root/.local/bin"
            cd /var/www/daddyai
            echo "dist contents:" && ls dist/
            pm2 reload daddyai --update-env || pm2 start ecosystem.config.cjs
            pm2 save
            echo "Deploy complete"
            pm2 list

      - name: Post-deploy health check
        id: health
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://168.144.180.56:3000/ 2>/dev/null || echo "000")
          echo "http_status=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "HEALTH_FAILED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-rollback on failure
        if: steps.health.outputs.HEALTH_FAILED == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/daddyai
            echo "Health check failed — rolling back..."
            export PATH="$PATH:/usr/local/bin:/root/.local/bin"
            pm2 reload daddyai --update-env 2>/dev/null || pm2 restart daddyai 2>/dev/null || true
            pm2 save 2>/dev/null || true
            echo "Rollback attempt complete"

      - name: Create rollback issue
        if: steps.health.outputs.HEALTH_FAILED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Auto-rollback triggered for ${{ needs.build.outputs.short_sha }}" \
            --body "Health check returned HTTP ${{ steps.health.outputs.http_status }} after deploy. Auto-rollback executed." \
            --label "deploy,bug"

      - name: Tag successful deploy
        if: steps.health.outputs.HEALTH_FAILED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments \
            -f ref=${{ github.sha }} \
            -f environment=production \
            -f description="Deploy ${{ needs.build.outputs.short_sha }}" \
            -f auto_merge=false \
            -f required_contexts='[]' 2>/dev/null || true

  backup:
    name: B2 Backup
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    steps:
      - name: Trigger B2 backup via SSH
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Backup project source (excluding node_modules and .git)
            BACKUP_NAME="daddyai-$(date +%Y%m%d-%H%M%S).tar.gz"
            cd /var/www
            tar czf "/tmp/$BACKUP_NAME" \
              --exclude='node_modules' \
              --exclude='.git' \
              daddyai/

            # Upload to B2 (skip if b2 missing)
            if command -v b2 >/dev/null 2>&1; then
              b2 file upload Kpakkaka "/tmp/$BACKUP_NAME" "backups/$BACKUP_NAME" 2>/dev/null && \
                echo "Backup uploaded: backups/$BACKUP_NAME" || \
                echo "B2 upload failed (non-fatal)"
            else
              echo "b2 not installed — skipping B2 upload (non-fatal)"
            fi

            # Cleanup local
            rm -f "/tmp/$BACKUP_NAME"

            # Keep only last 10 backups in B2
            b2 ls Kpakkaka backups/ --json 2>/dev/null | \
              python3 -c "
            import json, sys
            files = json.load(sys.stdin).get('files', [])
            files.sort(key=lambda f: f.get('uploadTimestamp', 0), reverse=True)
            for f in files[10:]:
                print(f['fileName'])
            " 2>/dev/null | while read f; do
              b2 delete-file-version "$f" 2>/dev/null && echo "Cleaned old backup: $f"
            done || true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## DaddyAI Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ needs.build.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback requested:** ${{ inputs.rollback || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
